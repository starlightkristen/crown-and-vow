name: Bootstrap and deploy isolated MarQrCam stack (Crown & Vow bachelorette test)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marqrcam-crown-vow-bach-2026-production
  cancel-in-progress: false

env:
  CF_WORKER: marqrcam-crown-vow-bach-2026
  CF_D1: marqrcam-crown-vow-bach-2026-db
  CF_R2: marqrcam-crown-vow-bach-2026-photos
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  bootstrap-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install

      - name: Require dedicated Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
          npx wrangler whoami

      - name: Verify repository isolation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"name": "marqrcam-crown-vow-bach-2026"' wrangler.jsonc
          grep -q '"database_name": "marqrcam-crown-vow-bach-2026-db"' wrangler.jsonc
          grep -q '"bucket_name": "marqrcam-crown-vow-bach-2026-photos"' wrangler.jsonc

      - name: Create or locate dedicated D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const x=rows.find(r=>r.name===process.env.CF_D1);if(x)process.stdout.write(x.uuid||x.id||'')")
          if [ -z "$DB_ID" ]; then
            echo "Creating dedicated D1 database: $CF_D1"
            npx wrangler d1 create "$CF_D1" --location enam
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID=$(node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const x=rows.find(r=>r.name===process.env.CF_D1);if(!x)process.exit(2);process.stdout.write(x.uuid||x.id||'')")
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Create or locate dedicated R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket info "$CF_R2" --json >/tmp/r2.json 2>/dev/null; then
            echo "Dedicated R2 bucket already exists: $CF_R2"
          else
            echo "Creating dedicated R2 bucket: $CF_R2"
            npx wrangler r2 bucket create "$CF_R2" --location enam
          fi

      - name: Bind this run only to the dedicated D1 UUID
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'wrangler.jsonc';
          let s = fs.readFileSync(p, 'utf8');
          if (!process.env.DB_ID) throw new Error('Missing D1 database ID');
          s = s.replace('REPLACE_WITH_D1_DATABASE_ID', process.env.DB_ID);
          fs.writeFileSync(p, s);
          NODE
          npm run check:isolation

      - name: Apply MarQrCam migrations
        shell: bash
        run: npx wrangler d1 migrations apply "$CF_D1" --remote

      - name: Deploy only the MarQrCam Worker
        shell: bash
        run: npx wrangler deploy
