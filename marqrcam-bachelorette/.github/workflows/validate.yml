name: Validate MarQrCam

on:
  pull_request:
  push:
    branches:
      - main
      - feat/production-vertical-slice

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate isolation, syntax, and Worker build
        run: npm run check
